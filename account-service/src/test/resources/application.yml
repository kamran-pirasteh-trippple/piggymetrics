de:
  flapdoodle:
    mongodb:
      embedded:
        version: 7.0.0

spring:
  data:
    mongodb:
      database: piggymetrics
      port: 0
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:0/.well-known/jwks.json
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

eureka:
  client:
    enabled: false
